name: companyos

x-app-env: &app-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://companyos_app:companyos_app_dev@postgres:5432/companyos
  MIGRATION_DATABASE_URL: postgresql+asyncpg://companyos:companyos_dev@postgres:5432/companyos
  REDIS_URL: redis://redis:6379/0
  TEMPORAL_ADDRESS: temporal:7233
  S3_ENDPOINT_URL: http://minio:9000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: companyos_dev
      POSTGRES_DB: companyos
    ports: ["5442:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyos -d companyos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: companyos
      POSTGRES_PWD: companyos_dev
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.37.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3100
    ports: ["8088:8080"]

  minio:
    image: chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: companyos
      MINIO_ROOT_PASSWORD: companyos_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  api:
    profiles: ["app"]
    build: { context: ./apps/api, dockerfile: Dockerfile }
    env_file: [.env]
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && uvicorn companyos.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ./apps/api, dockerfile: Dockerfile }
    env_file: [.env]
    environment: *app-env
    command: ["python", "-m", "companyos.worker"]
    depends_on:
      api: { condition: service_started }

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3100:3100"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
