name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos_dev
          POSTGRES_DB: companyos
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U companyos" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Prepare database roles
        run: PGPASSWORD=companyos_dev psql -h localhost -p 5442 -U companyos -d companyos -f ../../infrastructure/database/init.sql
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check companyos tests alembic && ruff format --check companyos tests
      - name: Type check
        run: mypy companyos
      - name: Tests (unit, API, tenant isolation, durable workflows)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
